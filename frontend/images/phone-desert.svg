<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" width="100%" height="100%">
  <defs>
    <!-- Titanium Body Gradient: Desert Titanium -->
    <linearGradient id="bodyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C5A88E"/>
      <stop offset="25%" stop-color="#DDC4AD"/>
      <stop offset="50%" stop-color="#B89B82"/>
      <stop offset="75%" stop-color="#E8D5C4"/>
      <stop offset="100%" stop-color="#9E8168"/>
    </linearGradient>

    <!-- Metal Frame Edge Gradient -->
    <linearGradient id="metalEdge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E0CABA"/>
      <stop offset="50%" stop-color="#9E8168"/>
      <stop offset="100%" stop-color="#DDC4AD"/>
    </linearGradient>

    <!-- Screen Glass Gradient -->
    <linearGradient id="screenGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0B10"/>
      <stop offset="40%" stop-color="#141724"/>
      <stop offset="70%" stop-color="#1F1B2C"/>
      <stop offset="100%" stop-color="#2D1B1E"/>
    </linearGradient>

    <!-- Wallpaper Glow -->
    <radialGradient id="screenWallpaper" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#E59866" stop-opacity="0.85"/>
      <stop offset="35%" stop-color="#BA4A00" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#2E1A47" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#07090F" stop-opacity="1"/>
    </radialGradient>

    <!-- Camera Lens Gradient -->
    <radialGradient id="lensOuter" cx="40%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#3A3D40"/>
      <stop offset="60%" stop-color="#1A1C1E"/>
      <stop offset="100%" stop-color="#0D0E10"/>
    </radialGradient>

    <radialGradient id="lensGlass" cx="35%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#2980B9" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#1B263B" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#050C1A" stop-opacity="1"/>
    </radialGradient>

    <!-- Shadow -->
    <filter id="phoneShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="25" stdDeviation="25" flood-color="#0F172A" flood-opacity="0.35"/>
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#9E8168" flood-opacity="0.25"/>
    </filter>

    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="250" cy="650" rx="170" ry="22" fill="#0F172A" opacity="0.28" filter="blur(14px)"/>

  <!-- Phone Container with Shadow -->
  <g filter="url(#phoneShadow)">
    <!-- Outer Titanium Border Frame -->
    <rect x="90" y="45" width="320" height="590" rx="52" fill="url(#metalEdge)" stroke="#D8C3B1" stroke-width="2"/>

    <!-- Inner Metallic Bezel -->
    <rect x="93" y="48" width="314" height="584" rx="49" fill="url(#bodyGradient)" stroke="#8C6F57" stroke-width="1.5"/>

    <!-- Antenna Bands -->
    <rect x="89" y="130" width="3" height="8" fill="#7D624B" opacity="0.8"/>
    <rect x="408" y="130" width="3" height="8" fill="#7D624B" opacity="0.8"/>
    <rect x="89" y="520" width="3" height="8" fill="#7D624B" opacity="0.8"/>
    <rect x="408" y="520" width="3" height="8" fill="#7D624B" opacity="0.8"/>

    <!-- Ultra-Slim Black Screen Bezel (6.9" display) -->
    <rect x="98" y="53" width="304" height="574" rx="44" fill="#000000"/>

    <!-- Active OLED Display Area -->
    <rect x="101" y="56" width="298" height="568" rx="41" fill="url(#screenWallpaper)"/>

    <!-- Ambient Abstract Graphic Wallpaper -->
    <circle cx="250" cy="300" r="110" fill="none" stroke="#F5B041" stroke-width="28" opacity="0.4" filter="url(#glowEffect)"/>
    <circle cx="250" cy="300" r="70" fill="none" stroke="#D35400" stroke-width="20" opacity="0.5"/>
    <path d="M 120 450 Q 250 360 380 480" stroke="#FAD7A0" stroke-width="3" fill="none" opacity="0.6"/>
    <path d="M 110 490 Q 250 390 390 510" stroke="#EB984E" stroke-width="2" fill="none" opacity="0.4"/>

    <!-- Status Bar (Top) -->
    <text x="140" y="85" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">9:41</text>

    <!-- Icons on top right -->
    <g transform="translate(340, 75)" fill="#FFFFFF">
      <!-- 5G Signal -->
      <rect x="0" y="7" width="2.5" height="4" rx="0.5"/>
      <rect x="4" y="5" width="2.5" height="6" rx="0.5"/>
      <rect x="8" y="3" width="2.5" height="8" rx="0.5"/>
      <rect x="12" y="1" width="2.5" height="10" rx="0.5"/>
      <!-- Wifi -->
      <path d="M 22 3 A 8 8 0 0 1 32 3 M 24 6 A 5 5 0 0 1 30 6 M 27 9 A 1 1 0 0 1 27 10" stroke="#FFF" stroke-width="1.2" fill="none"/>
      <!-- Battery -->
      <rect x="36" y="2" width="18" height="9" rx="2.5" fill="none" stroke="#FFF" stroke-width="1.2"/>
      <rect x="38" y="4" width="12" height="5" rx="1.5" fill="#2ECC71"/>
      <rect x="55" y="5" width="1.5" height="3" rx="0.5"/>
    </g>

    <!-- Dynamic Island -->
    <rect x="202" y="65" width="96" height="26" rx="13" fill="#000000"/>
    <!-- Front Camera Lens inside Dynamic Island -->
    <circle cx="280" cy="78" r="4.5" fill="#15171C"/>
    <circle cx="280" cy="78" r="2" fill="#2A3B5C"/>
    <!-- FaceID Sensor -->
    <circle cx="225" cy="78" r="3.5" fill="#0C0D10"/>

    <!-- Lockscreen Clock Widget -->
    <text x="250" y="210" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="54" font-weight="700" letter-spacing="-1" text-anchor="middle" opacity="0.95">09:41</text>
    <text x="250" y="235" fill="#E8D5C4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="500" text-anchor="middle" opacity="0.9">Thứ Hai, 12 tháng 10</text>

    <!-- Screen Glass Light Reflection -->
    <path d="M 105 60 L 390 60 L 290 620 L 105 620 Z" fill="white" opacity="0.03"/>
    <path d="M 103 65 L 180 65 L 103 250 Z" fill="white" opacity="0.08"/>

    <!-- Bottom Home Indicator -->
    <rect x="195" y="612" width="110" height="4" rx="2" fill="#FFFFFF" opacity="0.8"/>
  </g>

  <!-- Side Hardware Buttons -->
  <!-- Action Button -->
  <rect x="88" y="145" width="2" height="24" rx="1" fill="#C5A88E"/>
  <!-- Volume Up -->
  <rect x="88" y="185" width="2" height="44" rx="1" fill="#C5A88E"/>
  <!-- Volume Down -->
  <rect x="88" y="238" width="2" height="44" rx="1" fill="#C5A88E"/>
  <!-- Power Button -->
  <rect x="410" y="195" width="2" height="65" rx="1" fill="#C5A88E"/>
  <!-- New Camera Control Button -->
  <rect x="410" y="440" width="2.5" height="42" rx="1.2" fill="#E8D5C4" stroke="#9E8168" stroke-width="0.5"/>
</svg>
