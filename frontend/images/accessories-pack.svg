<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" width="100%" height="100%">
  <defs>
    <!-- Headphone Cushion Gradients -->
    <linearGradient id="hpHeadband" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <linearGradient id="hpCupGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Charger Adapter Gradient -->
    <linearGradient id="chargerWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="80%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>

    <!-- MagSafe Disc Gradient -->
    <radialGradient id="magsafePuck" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </radialGradient>

    <filter id="accShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="20" flood-color="#0F172A" flood-opacity="0.4"/>
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#F59E0B" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Ground Ambient Shadow -->
  <ellipse cx="250" cy="640" rx="190" ry="25" fill="#000000" opacity="0.3" filter="blur(16px)"/>

  <g filter="url(#accShadow)">
    
    <!-- 1. MagSafe Wireless Charging Puck (Top-Left Floating) -->
    <g transform="translate(60, 260) rotate(-15)">
      <circle cx="60" cy="60" r="55" fill="url(#magsafePuck)" stroke="#CBD5E1" stroke-width="2"/>
      <circle cx="60" cy="60" r="42" fill="#F8FAFC"/>
      <circle cx="60" cy="60" r="24" fill="none" stroke="#38BDF8" stroke-width="3" stroke-dasharray="8 4"/>
      <path d="M60 48 L56 60 L62 60 L58 72" stroke="#0284C7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>

    <!-- 2. Apple / Anker 20W Fast Charger Adapter (Bottom-Right) -->
    <g transform="translate(300, 380) rotate(12)">
      <rect x="0" y="0" width="110" height="110" rx="24" fill="url(#chargerWhite)" stroke="#CBD5E1" stroke-width="1.5"/>
      <!-- USB-C Port Cutout -->
      <rect x="35" y="46" width="40" height="18" rx="9" fill="#0F172A"/>
      <rect x="42" y="52" width="26" height="6" rx="3" fill="#E2E8F0"/>
      <!-- Status Glow LED -->
      <circle cx="55" cy="24" r="3" fill="#80ffbf"/>
      <text x="55" y="85" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="800" fill="#64748B" text-anchor="middle">20W PD</text>
    </g>

    <!-- 3. Over-Ear ANC Headphones (Center Hero Element) -->
    <!-- Headband Arc -->
    <path d="M150 260 C150 110, 350 110, 350 260" fill="none" stroke="url(#hpHeadband)" stroke-width="28" stroke-linecap="round"/>
    <path d="M165 245 C165 130, 335 130, 335 245" fill="none" stroke="#334155" stroke-width="14" stroke-linecap="round"/>
    
    <!-- Metal Extension Sliders -->
    <rect x="142" y="240" width="16" height="45" rx="4" fill="#94A3B8"/>
    <rect x="342" y="240" width="16" height="45" rx="4" fill="#94A3B8"/>

    <!-- Left Ear Cup & Cushion -->
    <g transform="translate(110, 270) rotate(-6)">
      <ellipse cx="40" cy="70" rx="36" ry="60" fill="url(#hpCupGrad)" stroke="#64748B" stroke-width="2"/>
      <ellipse cx="42" cy="70" rx="24" ry="48" fill="#0F172A"/>
      <circle cx="40" cy="70" r="16" fill="#1E293B"/>
    </g>

    <!-- Right Ear Cup & Cushion -->
    <g transform="translate(310, 270) rotate(6)">
      <ellipse cx="40" cy="70" rx="36" ry="60" fill="url(#hpCupGrad)" stroke="#64748B" stroke-width="2"/>
      <ellipse cx="38" cy="70" rx="24" ry="48" fill="#0F172A"/>
      <circle cx="40" cy="70" r="16" fill="#1E293B"/>
    </g>

    <!-- 4. Braided Type-C Cable Curving Gracefully -->
    <path d="M160 400 C180 520, 260 560, 320 480 S400 460, 360 560" fill="none" stroke="#F59E0B" stroke-width="6" stroke-linecap="round" stroke-dasharray="6 3"/>
    <!-- Cable connector head -->
    <rect x="150" y="380" width="20" height="30" rx="6" fill="#0F172A" stroke="#94A3B8" stroke-width="1"/>
    <rect x="155" y="370" width="10" height="10" rx="2" fill="#E2E8F0"/>

    <!-- Floating Sparkles / Sale Badges -->
    <g transform="translate(240, 100)">
      <circle cx="0" cy="0" r="28" fill="#F59E0B" fill-opacity="0.2" filter="blur(8px)"/>
      <polygon points="0,-14 4,-4 14,0 4,4 0,14 -4,4 -14,0 -4,-4" fill="#F59E0B"/>
    </g>
  </g>
</svg>
