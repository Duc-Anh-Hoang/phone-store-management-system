    <text x="250" y="235" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="500" text-anchor="middle" opacity="0.9">Thứ Hai, 12 tháng 10</text>

