<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" width="100%" height="100%">
  <defs>
    <!-- Titanium Body Gradient: Black Titanium -->
    <linearGradient id="bodyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#262626"/>
      <stop offset="25%" stop-color="#404040"/>
      <stop offset="50%" stop-color="#1F1F1F"/>
      <stop offset="75%" stop-color="#525252"/>
      <stop offset="100%" stop-color="#141414"/>
    </linearGradient>

    <linearGradient id="metalEdge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3D3D3D"/>
      <stop offset="50%" stop-color="#171717"/>
      <stop offset="100%" stop-color="#2E2E2E"/>
    </linearGradient>

    <radialGradient id="screenWallpaper" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#64748B" stop-opacity="0.8"/>
      <stop offset="35%" stop-color="#334155" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#1E293B" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="1"/>
    </radialGradient>

    <filter id="phoneShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="25" stdDeviation="25" flood-color="#000000" flood-opacity="0.45"/>
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#334155" flood-opacity="0.25"/>
    </filter>
  </defs>

  <ellipse cx="250" cy="650" rx="170" ry="22" fill="#000000" opacity="0.4" filter="blur(14px)"/>

  <g filter="url(#phoneShadow)">
    <rect x="90" y="45" width="320" height="590" rx="52" fill="url(#metalEdge)" stroke="#404040" stroke-width="2"/>
    <rect x="93" y="48" width="314" height="584" rx="49" fill="url(#bodyGradient)" stroke="#171717" stroke-width="1.5"/>

    <rect x="89" y="130" width="3" height="8" fill="#171717" opacity="0.8"/>
    <rect x="408" y="130" width="3" height="8" fill="#171717" opacity="0.8"/>
