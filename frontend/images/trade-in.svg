<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" width="100%" height="100%">
  <defs>
    <!-- Old Phone Gradients -->
    <linearGradient id="oldPhoneFrame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <!-- New Flagship Phone Gradients (#80ffbf neon tech vibe) -->
    <linearGradient id="newPhoneFrame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#80ffbf"/>
      <stop offset="30%" stop-color="#52e09e"/>
      <stop offset="70%" stop-color="#064e29"/>
      <stop offset="100%" stop-color="#061a0f"/>
    </linearGradient>

    <linearGradient id="newPhoneScreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061a0f"/>
      <stop offset="50%" stop-color="#0a3517"/>
      <stop offset="100%" stop-color="#020804"/>
    </linearGradient>

    <filter id="tradeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#061a0f" flood-opacity="0.45"/>
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#80ffbf" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="250" cy="650" rx="190" ry="24" fill="#000000" opacity="0.35" filter="blur(16px)"/>

  <g filter="url(#tradeShadow)">
    
    <!-- 1. OLD PHONE (Left, slightly angled back, darker slate) -->
    <g transform="translate(60, 160) rotate(-12)">
      <rect x="0" y="0" width="190" height="380" rx="28" fill="url(#oldPhoneFrame)" stroke="#64748B" stroke-width="2"/>
      <rect x="8" y="8" width="174" height="364" rx="22" fill="#0F172A"/>
      <rect x="14" y="14" width="162" height="352" rx="18" fill="#1E293B"/>
      
      <!-- Notch / Camera -->
      <path d="M60 14 L102 14 C100 24 62 24 60 14 Z" fill="#0F172A"/>
      <text x="95" y="180" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#94A3B8" text-anchor="middle">MÁY CŨ</text>
      <text x="95" y="205" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#64748B" text-anchor="middle">Định giá cao</text>
      <circle cx="95" cy="240" r="16" fill="#334155"/>
      <path d="M89 240 L94 245 L102 235" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>

    <!-- 2. NEW PHONE (Right, proud foreground, glowing titanium green) -->
    <g transform="translate(230, 90) rotate(8)">
      <rect x="0" y="0" width="220" height="440" rx="36" fill="url(#newPhoneFrame)" stroke="#80ffbf" stroke-width="3"/>
      <rect x="8" y="8" width="204" height="424" rx="30" fill="#020804"/>
      <rect x="12" y="12" width="196" height="416" rx="26" fill="url(#newPhoneScreen)"/>
      
      <!-- Dynamic Island -->
      <rect x="70" y="20" width="56" height="18" rx="9" fill="#000000" stroke="#80ffbf" stroke-width="0.8"/>
      
      <!-- Screen Graphic -->
      <circle cx="110" cy="190" r="60" fill="#80ffbf" opacity="0.15" filter="blur(16px)"/>
      <text x="110" y="170" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="900" fill="#FFFFFF" text-anchor="middle">LÊN ĐỜI</text>
      <text x="110" y="196" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#80ffbf" text-anchor="middle">SIÊU PHẨM 2026</text>
      
      <!-- Badge -->
      <rect x="35" y="225" width="150" height="32" rx="16" fill="#80ffbf" fill-opacity="0.2" stroke="#80ffbf" stroke-width="1.5"/>
      <text x="110" y="246" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#80ffbf" text-anchor="middle">Trợ giá đến 2.500K</text>
    </g>

    <!-- 3. CENTRAL DYNAMIC EXCHANGE ARROWS (GLOWING GREEN & GOLD) -->
    <g transform="translate(250, 340)">
      <!-- Circle Background -->
      <circle cx="0" cy="0" r="42" fill="#061a0f" stroke="#80ffbf" stroke-width="3" filter="drop-shadow(0 0 12px rgba(128,255,191,0.6))"/>
      
      <!-- Circular arrows -->
      <path d="M-22,-10 C-15,-26 15,-26 22,-10" fill="none" stroke="#80ffbf" stroke-width="4.5" stroke-linecap="round"/>
      <polygon points="24,-16 26,-4 14,-9" fill="#80ffbf"/>

      <path d="M22,10 C15,26 -15,26 -22,10" fill="none" stroke="#F59E0B" stroke-width="4.5" stroke-linecap="round"/>
      <polygon points="-24,16 -26,4 -14,9" fill="#F59E0B"/>

      <!-- Center Icon -->
      <circle cx="0" cy="0" r="8" fill="#FFFFFF"/>
    </g>

  </g>
</svg>
