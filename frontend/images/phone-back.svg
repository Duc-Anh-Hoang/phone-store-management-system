<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" width="100%" height="100%">
  <defs>
    <!-- Titanium Matte Glass Back Gradient (Desert Titanium) -->
    <linearGradient id="backMatteGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DDC4AD"/>
      <stop offset="40%" stop-color="#CBB19B"/>
      <stop offset="70%" stop-color="#BEA189"/>
      <stop offset="100%" stop-color="#A98A72"/>
    </linearGradient>

    <!-- Camera Plateau Island Gradient -->
    <linearGradient id="cameraPlateau" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EADBCC" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#CBB19B" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#B3957E" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Metal Ring for Lenses -->
    <linearGradient id="lensRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#CBB19B"/>
      <stop offset="70%" stop-color="#8C6F57"/>
      <stop offset="100%" stop-color="#EADBCC"/>
    </linearGradient>

    <!-- Deep Lens Optical Reflection -->
    <radialGradient id="deepLens" cx="35%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#3A3B45"/>
      <stop offset="30%" stop-color="#181B26"/>
      <stop offset="70%" stop-color="#0B0D14"/>
      <stop offset="100%" stop-color="#020305"/>
    </radialGradient>

    <radialGradient id="sapphireReflection" cx="30%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#00A8FF" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#192A56" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <filter id="cameraShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="5" stdDeviation="6" flood-color="#5C4533" flood-opacity="0.35"/>
    </filter>

    <filter id="phoneShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="25" stdDeviation="25" flood-color="#0F172A" flood-opacity="0.35"/>
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#9E8168" flood-opacity="0.25"/>
    </filter>
  </defs>

  <ellipse cx="250" cy="650" rx="170" ry="22" fill="#0F172A" opacity="0.28" filter="blur(14px)"/>

  <!-- Phone Body Back -->
  <g filter="url(#phoneShadow)">
    <!-- Outer Titanium Border Frame -->
    <rect x="90" y="45" width="320" height="590" rx="52" fill="#C5A88E" stroke="#E8D5C4" stroke-width="2"/>
    <!-- Matte Glass Back Plate -->
    <rect x="94" y="49" width="312" height="582" rx="48" fill="url(#backMatteGlass)"/>

    <!-- Subtle Matte Texture Highlight -->
    <path d="M 94 49 C 180 50 250 150 250 350 C 250 550 180 630 94 631 Z" fill="#FFFFFF" opacity="0.06"/>

    <!-- Apple Logo (Center) -->
    <g transform="translate(250, 340) scale(1.15)">
      <path d="M 0 -22 C -6 -22 -12 -18 -15 -18 C -18 -18 -24 -22 -29 -22 C -38 -22 -46 -14 -46 0 C -46 17 -34 38 -24 38 C -19 38 -15 35 -10 35 C -5 35 0 38 6 38 C 16 38 27 18 27 0 C 27 -2 26 -5 25 -7 C 20 -3 13 0 7 0 C -6 0 -13 -9 -13 -19 C -13 -21 -12 -22 -12 -22 C -8 -22 -4 -22 0 -22 Z" transform="translate(10, 0)" fill="#8C6F57" opacity="0.4"/>
      <!-- Leaf -->
      <path d="M 0 -25 C 2 -30 6 -34 10 -36 C 11 -31 8 -26 5 -23 C 3 -21 1 -23 0 -25 Z" transform="translate(10, 0)" fill="#8C6F57" opacity="0.4"/>
    </g>

    <!-- Camera Bump Plateau (Top Left) -->
    <rect x="112" y="65" width="158" height="162" rx="38" fill="url(#cameraPlateau)" filter="url(#cameraShadow)"/>

    <!-- 1. Top Camera (Main Fusion 48MP) -->
    <g transform="translate(155, 110)">
      <!-- Outer Metal Ring -->
      <circle cx="0" cy="0" r="32" fill="url(#lensRing)" stroke="#A98A72" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="28" fill="#1A1C23"/>
      <!-- Sapphire Glass & Aperture -->
      <circle cx="0" cy="0" r="22" fill="url(#deepLens)"/>
      <circle cx="-5" cy="-5" r="16" fill="url(#sapphireReflection)"/>
      <circle cx="0" cy="0" r="10" fill="#05070A"/>
      <circle cx="-6" cy="-6" r="3.5" fill="#FFFFFF" opacity="0.75"/>
    </g>

    <!-- 2. Bottom Camera (5x Tetraprism Telephoto) -->
    <g transform="translate(155, 182)">
      <circle cx="0" cy="0" r="32" fill="url(#lensRing)" stroke="#A98A72" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="28" fill="#1A1C23"/>
      <circle cx="0" cy="0" r="22" fill="url(#deepLens)"/>
      <circle cx="-5" cy="-5" r="16" fill="url(#sapphireReflection)"/>
      <circle cx="0" cy="0" r="9" fill="#05070A"/>
      <circle cx="-6" cy="-6" r="3" fill="#FFFFFF" opacity="0.75"/>
    </g>

    <!-- 3. Right Camera (Ultra Wide 48MP Macro) -->
    <g transform="translate(225, 146)">
      <circle cx="0" cy="0" r="32" fill="url(#lensRing)" stroke="#A98A72" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="28" fill="#1A1C23"/>
      <circle cx="0" cy="0" r="22" fill="url(#deepLens)"/>
      <circle cx="-5" cy="-5" r="16" fill="url(#sapphireReflection)"/>
      <circle cx="0" cy="0" r="10" fill="#05070A"/>
      <circle cx="-6" cy="-6" r="3" fill="#FFFFFF" opacity="0.75"/>
    </g>

    <!-- True Tone Flash -->
    <circle cx="225" cy="98" r="11" fill="#FDFEFE" stroke="#D5D8DC" stroke-width="1.5"/>
    <circle cx="225" cy="98" r="7.5" fill="#FAD7A0"/>
    <circle cx="225" cy="98" r="3.5" fill="#F39C12"/>

    <!-- LiDAR Scanner -->
    <circle cx="225" cy="195" r="9" fill="#1A1C23" stroke="#424949" stroke-width="1"/>
    <circle cx="225" cy="195" r="5" fill="#0B0C10"/>

    <!-- Microphone Hole -->
    <circle cx="192" cy="195" r="2.5" fill="#2C3E50"/>
  </g>
</svg>
