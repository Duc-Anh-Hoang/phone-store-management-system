<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" width="100%" height="100%">
  <defs>
    <linearGradient id="ipadFrame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="40%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <linearGradient id="ipadScreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="35%" stop-color="#1E1B4B"/>
      <stop offset="70%" stop-color="#042F2E"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <filter id="ipadShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="25" stdDeviation="24" flood-color="#020617" flood-opacity="0.5"/>
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#80ffbf" flood-opacity="0.25"/>
    </filter>
  </defs>

  <ellipse cx="250" cy="650" rx="200" ry="24" fill="#000000" opacity="0.35" filter="blur(16px)"/>

  <g filter="url(#ipadShadow)">
    <!-- iPad Body (Ultra-thin rounded rectangle) -->
    <rect x="70" y="80" width="360" height="520" rx="28" fill="url(#ipadFrame)" stroke="#94A3B8" stroke-width="2"/>
    <rect x="78" y="88" width="344" height="504" rx="22" fill="#020617"/>
    <rect x="84" y="94" width="332" height="492" rx="18" fill="url(#ipadScreen)"/>

    <!-- Screen Wallpaper Waves -->
    <path d="M84 450 Q200 320 280 400 T416 280 L416 586 L84 586 Z" fill="#80ffbf" opacity="0.15"/>
    <circle cx="280" cy="300" r="100" fill="#38BDF8" opacity="0.15" filter="blur(25px)"/>

    <!-- Front Camera Center -->
    <circle cx="250" cy="102" r="3.5" fill="#000000"/>
    <circle cx="250" cy="102" r="1.5" fill="#38BDF8"/>

    <!-- Screen Mock Elements -->
    <text x="250" y="240" font-family="'Plus Jakarta Sans', sans-serif" font-size="36" font-weight="900" fill="#FFFFFF" text-anchor="middle">iPad Pro M4</text>
    <text x="250" y="272" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#80ffbf" text-anchor="middle">Mỏng 5.1mm - Màn Tandem OLED</text>

    <!-- Apple Pencil Snapped on Top -->
    <g transform="translate(140, 56)">
      <rect x="0" y="0" width="220" height="14" rx="7" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <path d="M220 0 L234 7 L220 14 Z" fill="#E2E8F0"/>
      <circle cx="230" cy="7" r="2" fill="#475569"/>
      <!-- Magnetic charging indicator -->
      <circle cx="110" cy="7" r="2.5" fill="#80ffbf"/>
    </g>
  </g>
</svg>
