# 1. Chuyển hướng tự động toàn bộ HTTP (cổng 80) sang HTTPS (cổng 443)
server {
    listen 80;
    server_name shop.ai-learning-dashboard.id.vn localhost;

    # Cho phép Certbot tự động gia hạn chứng chỉ qua webroot nếu cần
    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Server HTTPS chính (cổng 443) với chứng chỉ Let's Encrypt
server {
    listen 443 ssl;
    server_name shop.ai-learning-dashboard.id.vn localhost;

    ssl_certificate /etc/letsencrypt/live/shop.ai-learning-dashboard.id.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shop.ai-learning-dashboard.id.vn/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Static Files & Clean URLs with strict No-Cache for HTML
    location = / {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        try_files /index.html =404;
    }

    location = /home {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        try_files /index.html =404;
    }

    location = /admin {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        try_files /pages/admin.html /admin.html =404;
    }

    location = /admin.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        try_files /pages/admin.html /admin.html =404;
    }

    location = /cart {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        try_files /pages/cart.html /cart.html =404;
    }

    location = /cart.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        try_files /pages/cart.html /cart.html =404;
    }

    location = /category {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        try_files /pages/category.html /category.html =404;
    }

    location = /category.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        try_files /pages/category.html /category.html =404;
    }

    location = /product-detail {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        try_files /pages/product-detail.html /product-detail.html =404;
    }

    location = /product-detail.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        try_files /pages/product-detail.html /product-detail.html =404;
    }

    location = /profile {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        try_files /pages/profile.html /profile.html =404;
    }

    location = /profile.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        try_files /pages/profile.html /profile.html =404;
    }

    location = /complete-registration {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        try_files /pages/complete-registration.html /complete-registration.html =404;
    }

    location = /complete-registration.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        try_files /pages/complete-registration.html /complete-registration.html =404;
    }

    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        try_files $uri $uri/ /pages$uri /pages$uri.html /index.html;
    }

    # Proxy API sang Backend .NET 10 Web API container
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cache_bypass $http_upgrade;
    }

    # Static Assets during local dev (no-cache)
    location ~* \.(css|js|json|svg|png|jpg|jpeg|gif|ico|woff|woff2|ttf)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
