services:
  # -------------------------------------------------------------
  # 1. DỊCH VỤ CƠ SỞ DỮ LIỆU: MICROSOFT SQL SERVER 2022
  # -------------------------------------------------------------
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver_quanlycuahang
    restart: always
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=Password123!
      - MSSQL_PID=Express
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Password123!' -C -Q 'SELECT 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s
    networks:
      - app_network

  # -------------------------------------------------------------
  # 2. DỊCH VỤ KHỞI TẠO CƠ SỞ DỮ LIỆU TỰ ĐỘNG (TABLE.SQL & CODE.SQL)
  # -------------------------------------------------------------
  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver_init_db
    depends_on:
      sqlserver:
        condition: service_healthy
    volumes:
      - ./database:/database
    entrypoint: >
      bash -c '
        echo "=== [SQL INIT] Đang kiểm tra kết nối SQL Server... ==="
        until /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "Password123!" -C -Q "SELECT 1" &> /dev/null; do
          sleep 2
        done
        echo "=== [SQL INIT] Đang chạy Table.sql và Code.sql để tạo Database QuanLyCuaHangDienThoai... ==="
        /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "Password123!" -C -i /database/Table.sql
        /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "Password123!" -C -i /database/Code.sql
        echo "=== [SQL INIT] Khởi tạo Database hoàn tất thành công! ==="
      '
    networks:
      - app_network

  # -------------------------------------------------------------
  # 3. DỊCH VỤ BACKEND: JAVA SPRING BOOT API (PORT 8080)
  # -------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend_spring_boot
    restart: always
    depends_on:
      sqlserver:
        condition: service_healthy
      sqlserver-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:sqlserver://sqlserver:1433;databaseName=QuanLyCuaHangDienThoai;encrypt=false;trustServerCertificate=true
      - SPRING_DATASOURCE_USERNAME=sa
      - SPRING_DATASOURCE_PASSWORD=Password123!
      - SPRING_JPA_HIBERNATE_DDL_AUTO=none
    networks:
      - app_network

  # -------------------------------------------------------------
  # 4. DỊCH VỤ FRONTEND: NGINX WEB SERVER & REVERSE PROXY (PORT 80)
  # -------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend_landing_page
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - app_network

# -------------------------------------------------------------
# KHAI BÁO VOLUMES & MẠNG NỘI BỘ
# -------------------------------------------------------------
volumes:
  mssql_data:
    driver: local

networks:
  app_network:
    driver: bridge
